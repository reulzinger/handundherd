name: Deploy to GitHub Pages

# Veröffentlicht den Stand dieses Branches auf dem gh-pages-Branch,
# von dem GitHub Pages die Seite ausliefert.
on:
  push:
    branches: [claude/hand-herd-website-hh9byd]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
